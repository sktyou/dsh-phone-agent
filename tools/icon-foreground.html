<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DSH Agent icon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 432px; height: 432px; background: transparent; }

  /* Adaptive-icon foreground: only the middle ~66% is guaranteed visible, so the
     text is sized to sit well inside that safe zone rather than near the edges. */
  .fg {
    width: 432px; height: 432px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px;
    font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  .dsh {
    font-size: 96px; font-weight: 800; letter-spacing: 2px; line-height: 1;
    text-shadow: 0 2px 10px rgba(0,0,0,.18);
  }
  .agent {
    font-size: 58px; font-weight: 600; letter-spacing: 6px; line-height: 1;
    opacity: .95;
  }
  .rule {
    width: 108px; height: 4px; border-radius: 2px;
    background: rgba(255,255,255,.55); margin: 10px 0 8px;
  }
</style>
</head>
<body>
  <div class="fg">
    <div class="dsh">DSH</div>
    <div class="rule"></div>
    <div class="agent">Agent</div>
  </div>
</body>
</html>
