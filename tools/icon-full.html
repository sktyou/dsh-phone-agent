<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DSH Agent icon (full)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 432px; height: 432px; }

  /* Legacy launcher icon: background and text in one image, for launchers that
     do not read the adaptive-icon descriptor. */
  .icon {
    width: 432px; height: 432px;
    background: linear-gradient(135deg, #3b82f6 0%, #2563eb 42%, #0ea36b 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px;
    font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  .dsh { font-size: 96px; font-weight: 800; letter-spacing: 2px; line-height: 1; }
  .rule { width: 108px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.55); margin: 10px 0 8px; }
  .agent { font-size: 58px; font-weight: 600; letter-spacing: 6px; line-height: 1; opacity: .95; }
</style>
</head>
<body>
  <div class="icon">
    <div class="dsh">DSH</div>
    <div class="rule"></div>
    <div class="agent">Agent</div>
  </div>
</body>
</html>
